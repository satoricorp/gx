    fetch: pdf
    notes: "BitsAI-CR (ByteDance, FSE 2025). Precision-tracked rule library in production. Closest prior art to GX ruleset. READ FIRST."
  - id: codereviewer-2022
    url: https://dl.acm.org/doi/10.1145/3540250.3549081
    tier: research
    fetch: pdf
    notes: "Li et al., CodeReviewer dataset/benchmark (ESEC/FSE 2022). Fall back to arXiv 2203.09095 if gated."
  - id: cr-benchmark-survey-2026
    url: https://arxiv.org/abs/2602.13377
    tier: research
    fetch: pdf
    notes: "Survey of code review benchmarks, pre-LLM and LLM era. Use bibliography for backfill."
  - id: swr-bench-2025
    url: https://arxiv.org/abs/2509.01494
    tier: research
    fetch: pdf
    notes: "SWR-Bench: LLM review comment generation on real-world PRs."
  - id: agentic-review-roadmap
    url: https://arxiv.org/abs/2605.17548
    tier: research
