    tier: process
    authority: 1
    crawl_depth: 2
    max_urls: 150
    notes: "Google API Improvement Proposals: resource-oriented API design, naming, standard methods, errors, versioning. One AIP per page chunks atomically. CC-BY. Crawl from the root: crawl_links only follows path-prefix matches, and per-AIP paths (/121) do not extend /general — depth 2 reaches root -> index -> AIP pages."
