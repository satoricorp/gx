    tier: research
    fetch: pdf
    notes: "Convergent practices: small changes, fast turnaround. Empirical basis for demux/stacking."
  - id: czerwonka-2015
    url: https://www.microsoft.com/en-us/research/wp-content/uploads/2015/05/PID3556473.pdf
    tier: research
    fetch: pdf
    notes: "Code Reviews Do Not Find Bugs (ICSE 2015)."
  - id: mcintosh-2014
    url: https://dl.acm.org/doi/10.1145/2597073.2597082
    tier: research
    fetch: pdf
    notes: "Review coverage/participation vs post-release defects (MSR 2014). ACM page may gate PDF - fall back to author preprint, mark manual if blocked."
