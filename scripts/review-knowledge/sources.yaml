    languages: [go]
  - id: govulncheck
    url: https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck
    tier: security
    languages: [go]
    authority: 3
  - id: rust-api-guidelines
    url: https://rust-lang.github.io/api-guidelines/about.html
    tier: language
    languages: [rust]
    authority: 1
    crawl_depth: 1
  - id: rust-nomicon
    url: https://doc.rust-lang.org/nomicon/
    tier: language
    languages: [rust]
    crawl_depth: 1
    notes: "Unsafe semantics background."
  - id: rust-unsafe-code-guidelines
    url: https://rust-lang.github.io/unsafe-code-guidelines/
    tier: language
    languages: [rust]
    authority: 3
    crawl_depth: 1
    notes: "Explicitly non-normative WIP - rules derived from it must be advisory severity only."
  - id: clippy
    url: https://doc.rust-lang.org/clippy/
    tier: style
    languages: [rust]
    crawl_depth: 1
    notes: "DECISION-B tier for lint-level content; correctness lints are tier language."
