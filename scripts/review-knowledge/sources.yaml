# Approved source manifest for review-corpus-v2 and research-corpus-v1.
# This supersedes urls.json for v2. Defaults: authority: 2,
# precedence_group: null, superseded_by: null, historical: false,
# crawl_depth: 0, fetch: html, license: verify.
sources:
  - id: google-eng-practices
    url: https://google.github.io/eng-practices/review/
    tier: process
    authority: 1
    crawl_depth: 2
    notes: "Subsumes former standard.html, looking-for.html, small-cls.html entries. Covers reviewer + author guides."
  - id: ms-playbook-code-reviews
    url: https://microsoft.github.io/code-with-engineering-playbook/code-reviews/
    tier: process
    crawl_depth: 1
    notes: "Subsumes former reviewer-guidance entry."
  - id: gitlab-code-review
    url: https://docs.gitlab.com/development/code_review/
    tier: process
  - id: firefox-reviewer-checklist
    url: https://firefox-source-docs.mozilla.org/contributing/reviewer_checklist.html
    tier: process
  - id: smartbear-best-practices
    url: https://smartbear.com/learn/code-review/best-practices-for-peer-code-review/
    tier: process
    notes: "Cisco study summary; source of 200-400 LOC and <500 LOC/hr findings. Earlier 'robots disallows' failures were an artifact of fetching robots.txt with the default Python-urllib agent; smartbear's actual policy allows /learn/."
  - id: conventional-comments
    url: https://conventionalcomments.org/
    tier: process
    notes: "Comment labeling taxonomy; candidate output format for machine-generated comments. Single-page source: 2 chunks IS the complete site, including the full label table."
  - id: owasp-asvs
    url: https://github.com/OWASP/ASVS/tree/master/5.0/en
    tier: security
    authority: 1
    precedence_group: security-spine
    fetch: github-md
    crawl_depth: 1
    notes: "SPINE of security rules per precedence table. Tree URL expands to all 27 ASVS 5.0 chapter/appendix markdowns; the repo README alone carried none of the requirements."
  - id: owasp-top10
    url: https://github.com/OWASP/Top10/tree/master/2025/docs/en
    tier: security
    precedence_group: security-spine
    fetch: github-md
    crawl_depth: 1
    notes: "Cross-reference metadata; ranked below ASVS. owasp.org robots.txt disallows fetching; the tree URL expands to the full 2025 edition (intro + A01-A10 + next steps)."
  - id: cwe-top25
    url: https://cwe.mitre.org/top25/
    tier: security
    precedence_group: security-spine
    crawl_depth: 1
    notes: "Cross-reference metadata (cwe_ids); ranked below ASVS. The landing page alone is one thin chunk; depth 1 pulls the current-edition list, insights, and methodology pages linked from it."
  - id: owasp-cheatsheets
    url: https://github.com/OWASP/CheatSheetSeries/tree/master/cheatsheets
    tier: security
    fetch: github-md
    crawl_depth: 1
    notes: "cheatsheetseries.owasp.org robots.txt disallows fetching, so pull from the repo. Tree URL expands to every cheat sheet markdown; sheets with dedicated entries (sqli, db, deserialization) are skipped by URL and stay their own sources."
  - id: owasp-sqli-cheatsheet
    url: https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.md
    tier: security
    languages: [sql]
    fetch: github-md
  - id: owasp-db-cheatsheet
    url: https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Database_Security_Cheat_Sheet.md
    tier: security
    languages: [sql]
    fetch: github-md
  - id: openssf-concise-guide
    url: https://best.openssf.org/Concise-Guide-for-Developing-More-Secure-Software
    tier: security
    notes: "Single-page source: 2 chunks IS the complete guide (one bullet list)."
  - id: openssf-scorecard
    url: https://scorecard.dev/
    tier: security
    notes: "Supply chain checks."
  - id: slsa
    url: https://slsa.dev/
    tier: security
    crawl_depth: 1
    notes: "Supply chain levels."
  - id: nist-ssdf-800-218
    url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-218.pdf
    tier: security
    authority: 3
    fetch: pdf
    notes: "Process compliance, not code review. Retained for completeness; candidate for retrieval exclusion - low authority keeps it deprioritized. csrc.nist.gov robots.txt disallows the pub landing page; nvlpubs serves the PDF directly."
  - id: semgrep-registry
    url: https://github.com/semgrep/semgrep-docs/blob/main/docs/contributing/contributing-to-semgrep-rules-repository.mdx
    tier: security
    fetch: github-md
    notes: "Prior art for rule taxonomy. semgrep.dev/r is a JS app that yields nothing; this doc specifies the registry's rule metadata taxonomy (category, subcategory, likelihood, impact, confidence, CWE/OWASP references)."
  - id: google-tsguide
    url: https://google.github.io/styleguide/tsguide.html
    tier: language
    languages: [typescript]
    precedence_group: ts-style
    notes: "Wins on design-level topics with no lint rule; loses to ts-eslint on mechanical conflicts. Default-export ban: encode as prefer-named with framework exceptions."
  - id: tsconfig-reference
    url: https://www.typescriptlang.org/tsconfig/
    tier: language
    languages: [typescript]
    authority: 3
    notes: "Reference material for config review."
  - id: typescript-eslint-typed-linting
    url: https://typescript-eslint.io/getting-started/typed-linting/
    tier: language
    languages: [typescript]
    authority: 1
    precedence_group: ts-style
  - id: eslint-rules
    url: https://eslint.org/docs/latest/rules/
    tier: style
    languages: [typescript, javascript]
    crawl_depth: 1
    notes: "DECISION-B tier. Large crawl; rule pages are atomic chunks."
  - id: nodejs-security
    url: https://nodejs.org/en/learn/getting-started/security-best-practices
    tier: security
    languages: [typescript, javascript]
  - id: pep8
    url: https://peps.python.org/pep-0008/
    tier: language
    languages: [python]
    precedence_group: python-style
    notes: "Formatting sections: chunk-level superseded_by: ruff per spec Phase 2."
  - id: google-pyguide
    url: https://google.github.io/styleguide/pyguide.html
    tier: language
    languages: [python]
    authority: 3
    precedence_group: python-style
  - id: ruff
    url: https://github.com/astral-sh/ruff/tree/main/docs
    tier: style
    languages: [python]
    authority: 1
    precedence_group: python-style
    fetch: github-md
    crawl_depth: 1
    notes: "WINNER of python-style group. Pin google docstring convention (D211/D212); tag D203/D213 chunks superseded. The repo docs tree carries configuration/linter/formatter/faq guidance; the generated per-rule reference is ingested separately as ruff-rules."
  - id: ruff-rules
    url: https://docs.astral.sh/ruff/rules/
    tier: style
    languages: [python]
    authority: 1
    precedence_group: python-style
    notes: "Generated rule reference: the index page tables every rule code, name, and message across all linters ruff implements. docs.astral.sh serves no robots.txt (the earlier 'robots disallows' failure was the Python-urllib UA artifact); depth 0 ingests the full table without crawling ~800 per-rule pages."
  - id: mypy
    url: https://github.com/python/mypy/tree/master/docs/source
    tier: language
    languages: [python]
    fetch: github-md
    crawl_depth: 1
    notes: "Tag tool-specific behavior chunks; typing spec (typing-python) is authoritative on semantics. mypy.readthedocs.io robots.txt disallows fetching; the repo docs tree carries the full manual as .rst."
  - id: typing-python-spec
    url: https://github.com/python/typing/tree/main/docs/spec
    tier: language
    languages: [python]
    authority: 1
    fetch: github-md
    crawl_depth: 1
    notes: "typing.python.org robots.txt disallows fetching; the repo spec tree carries every chapter as .rst."
  - id: bandit
    url: https://github.com/PyCQA/bandit/tree/main/doc/source
    tier: security
    languages: [python]
    fetch: github-md
    crawl_depth: 1
    notes: "The repo doc tree carries config/start/faq as .rst; the autodoc-rendered per-plugin pages are ingested separately as bandit-plugins."
