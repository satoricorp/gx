# Approved source manifest for review-corpus-v2 and research-corpus-v1.
# This supersedes urls.json for v2. Defaults: authority: 2,
# precedence_group: null, superseded_by: null, historical: false,
# crawl_depth: 0, fetch: html, license: verify.
sources:
  - id: google-eng-practices
    url: https://google.github.io/eng-practices/review/
    tier: process
    authority: 1
    crawl_depth: 2
    notes: "Subsumes former standard.html, looking-for.html, small-cls.html entries. Covers reviewer + author guides."
  - id: ms-playbook-code-reviews
    url: https://microsoft.github.io/code-with-engineering-playbook/code-reviews/
    tier: process
    crawl_depth: 1
    notes: "Subsumes former reviewer-guidance entry."
  - id: gitlab-code-review
    url: https://docs.gitlab.com/development/code_review/
    tier: process
  - id: firefox-reviewer-checklist
    url: https://firefox-source-docs.mozilla.org/contributing/reviewer_checklist.html
    tier: process
  - id: smartbear-best-practices
    url: https://smartbear.com/learn/code-review/best-practices-for-peer-code-review/
    tier: process
    notes: "Cisco study summary; source of 200-400 LOC and <500 LOC/hr findings."
  - id: conventional-comments
    url: https://conventionalcomments.org/
    tier: process
    notes: "Comment labeling taxonomy; candidate output format for machine-generated comments."
  - id: owasp-asvs
    url: https://github.com/OWASP/ASVS
    tier: security
    authority: 1
    precedence_group: security-spine
    fetch: github-md
    crawl_depth: 2
    notes: "SPINE of security rules per precedence table. Fetch 5.0 markdown from repo, not the project landing page."
  - id: owasp-top10
    url: https://owasp.org/Top10/
    tier: security
    precedence_group: security-spine
    crawl_depth: 1
    notes: "Cross-reference metadata; ranked below ASVS."
  - id: cwe-top25
    url: https://cwe.mitre.org/top25/
    tier: security
    precedence_group: security-spine
    notes: "Cross-reference metadata (cwe_ids); ranked below ASVS."
  - id: owasp-cheatsheets
    url: https://cheatsheetseries.owasp.org/index.html
    tier: security
    crawl_depth: 1
    notes: "Crawl subsumes SQLi + Database Security cheatsheet entries below; dedup by URL."
  - id: owasp-sqli-cheatsheet
    url: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
    tier: security
    languages: [sql]
  - id: owasp-db-cheatsheet
    url: https://cheatsheetseries.owasp.org/cheatsheets/Database_Security_Cheat_Sheet.html
    tier: security
    languages: [sql]
  - id: openssf-concise-guide
    url: https://best.openssf.org/Concise-Guide-for-Developing-More-Secure-Software
    tier: security
  - id: openssf-scorecard
    url: https://scorecard.dev/
    tier: security
    notes: "Supply chain checks."
  - id: slsa
    url: https://slsa.dev/
    tier: security
    crawl_depth: 1
    notes: "Supply chain levels."
  - id: nist-ssdf-800-218
    url: https://csrc.nist.gov/pubs/sp/800/218/final
    tier: security
    authority: 3
    fetch: pdf
    notes: "Process compliance, not code review. Retained for completeness; candidate for retrieval exclusion - low authority keeps it deprioritized."
  - id: semgrep-registry
    url: https://semgrep.dev/r
    tier: security
    notes: "JS app, not crawlable HTML - use registry API or github.com/semgrep/semgrep-rules for rule text. Prior art for rule taxonomy."
  - id: google-tsguide
    url: https://google.github.io/styleguide/tsguide.html
    tier: language
    languages: [typescript]
    precedence_group: ts-style
    notes: "Wins on design-level topics with no lint rule; loses to ts-eslint on mechanical conflicts. Default-export ban: encode as prefer-named with framework exceptions."
  - id: tsconfig-reference
    url: https://www.typescriptlang.org/tsconfig/
    tier: language
    languages: [typescript]
    authority: 3
    notes: "Reference material for config review."
  - id: typescript-eslint-typed-linting
    url: https://typescript-eslint.io/getting-started/typed-linting/
    tier: language
    languages: [typescript]
    authority: 1
    precedence_group: ts-style
  - id: eslint-rules
    url: https://eslint.org/docs/latest/rules/
    tier: style
    languages: [typescript, javascript]
    crawl_depth: 1
    notes: "DECISION-B tier. Large crawl; rule pages are atomic chunks."
  - id: nodejs-security
    url: https://nodejs.org/en/learn/getting-started/security-best-practices
    tier: security
    languages: [typescript, javascript]
  - id: pep8
    url: https://peps.python.org/pep-0008/
    tier: language
    languages: [python]
    precedence_group: python-style
    notes: "Formatting sections: chunk-level superseded_by: ruff per spec Phase 2."
  - id: google-pyguide
    url: https://google.github.io/styleguide/pyguide.html
    tier: language
    languages: [python]
    authority: 3
    precedence_group: python-style
  - id: ruff
    url: https://docs.astral.sh/ruff/
    tier: style
    languages: [python]
    authority: 1
    precedence_group: python-style
    crawl_depth: 1
    notes: "WINNER of python-style group. Pin google docstring convention (D211/D212); tag D203/D213 chunks superseded."
  - id: mypy
    url: https://mypy.readthedocs.io/
    tier: language
    languages: [python]
    crawl_depth: 1
    notes: "Tag tool-specific behavior chunks; typing spec (typing-python) is authoritative on semantics."
  - id: typing-python-spec
    url: https://typing.python.org/
    tier: language
    languages: [python]
    authority: 1
    crawl_depth: 1
  - id: bandit
    url: https://bandit.readthedocs.io/
    tier: security
    languages: [python]
    crawl_depth: 1
  - id: google-go-style
    url: https://google.github.io/styleguide/go/
    tier: language
    languages: [go]
    authority: 1
    precedence_group: go-guidance
    crawl_depth: 1
    notes: "WINNER of go-guidance group."
  - id: go-code-review-comments
    url: https://go.dev/wiki/CodeReviewComments
    tier: language
    languages: [go]
    precedence_group: go-guidance
  - id: uber-go-guide
    url: https://github.com/uber-go/guide
    tier: language
    languages: [go]
    precedence_group: go-guidance
    fetch: github-md
    notes: "Supplemental strictness; where stricter than Google (init(), error wrapping), Uber's rule is adopted."
  - id: effective-go
    url: https://go.dev/doc/effective_go
    tier: language
    languages: [go]
    authority: 4
    precedence_group: go-guidance
    historical: true
