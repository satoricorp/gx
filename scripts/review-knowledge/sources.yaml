  - id: bandit
    url: https://github.com/PyCQA/bandit/tree/main/doc/source
    tier: security
    languages: [python]
    fetch: github-md
    crawl_depth: 1
    notes: "bandit.readthedocs.io robots.txt disallows fetching; the repo doc tree carries config/start/faq as .rst (per-plugin pages are autodoc stubs and stay unfetched)."
  - id: google-go-style
    url: https://google.github.io/styleguide/go/
    tier: language
    languages: [go]
    authority: 1
