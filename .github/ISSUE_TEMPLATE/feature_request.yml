name: Feature request
description: Suggest a change to how gx works.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behavior you want. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
